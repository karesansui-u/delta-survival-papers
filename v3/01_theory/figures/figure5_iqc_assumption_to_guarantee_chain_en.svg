<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">IQC assumption-to-guarantee chain</title>
  <desc id="desc">Layered flow from raw events to Lean coherent-mass comparison</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="170" height="110" rx="10" ry="10" fill="#edf2ff" stroke="#2b4dd5" stroke-width="2"/>
  <text x="105" y="40" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#1f2d5b" font-weight="700">Raw Memory / Premise /</text>
  <text x="105" y="58" text-anchor="middle" font-size="14" font-family="Arial, sans-serif" fill="#1f2d5b" font-weight="700">Update Event</text>
  <text x="105" y="80" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#1f2d5b">agent turns, edits,</text>
  <text x="105" y="96" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#1f2d5b">agent actions, citations</text>

  <rect x="235" y="20" width="200" height="110" rx="10" ry="10" fill="#eaf8f0" stroke="#1f8b4c" stroke-width="2"/>
  <text x="335" y="40" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#1b5e3a" font-weight="700">Qualification State</text>
  <text x="335" y="60" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1b5e3a">source / speechAct / permission</text>
  <text x="335" y="76" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1b5e3a">scope / versionState / use-condition</text>
  <text x="335" y="92" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1b5e3a">-> qualified state</text>

  <rect x="480" y="20" width="190" height="110" rx="10" ry="10" fill="#fff4e6" stroke="#b66a10" stroke-width="2"/>
  <text x="575" y="40" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#7a4308" font-weight="700">Controlled Actions</text>
  <text x="575" y="60" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#7a4308">admit / block / invalidate / repair</text>
  <text x="575" y="80" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#7a4308">per-step loss / repair signals</text>

  <rect x="705" y="20" width="170" height="110" rx="10" ry="10" fill="#f9e6ff" stroke="#6e2ca2" stroke-width="2"/>
  <text x="790" y="40" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#461f66" font-weight="700">Runner / Evidence</text>
  <text x="790" y="58" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#461f66">task surface</text>
  <text x="790" y="74" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#461f66">frozen readout</text>
  <text x="790" y="90" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#461f66">metrics &amp; certificate</text>

  <rect x="900" y="20" width="180" height="110" rx="10" ry="10" fill="#f0f5ff" stroke="#25408f" stroke-width="2"/>
  <text x="990" y="40" text-anchor="middle" font-size="13" font-family="Arial, sans-serif" fill="#1a2b66" font-weight="700">Lean Guarantee</text>
  <text x="990" y="58" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1a2b66">NetActionNoWorse witness</text>
  <text x="990" y="74" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1a2b66">protocol-valid protocol</text>
  <text x="990" y="90" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#1a2b66">coherentMass_controlled >= baseline</text>

  <line x1="190" y1="75" x2="235" y2="75" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="435" y1="75" x2="480" y2="75" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="75" x2="705" y2="75" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="875" y1="75" x2="900" y2="75" stroke="#222" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="120" y1="140" x2="990" y2="140" stroke="#666" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="555" y="156" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#444">Frozen protocol obligations + readout alignment + positive trajectory</text>

  <rect x="250" y="170" width="240" height="70" rx="10" ry="10" fill="#f5f8ff" stroke="#3b5599" stroke-width="2"/>
  <text x="370" y="194" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#20386b">same-initial-mass + no-worse net action</text>
  <text x="370" y="214" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#20386b">-> controlled mass is not worse than baseline</text>

  <rect x="620" y="170" width="230" height="70" rx="10" ry="10" fill="#fff7f7" stroke="#a03030" stroke-width="2"/>
  <text x="735" y="194" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#6b1d1d">assumption-to-guarantee claim only</text>
  <text x="735" y="214" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#6b1d1d">not model-semantic or universal safety proof</text>
</svg>
