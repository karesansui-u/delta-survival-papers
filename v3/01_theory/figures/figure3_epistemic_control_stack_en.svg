<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Structural Persistence to LLM Epistemic Control</title>
  <desc id="desc">A layered diagram connecting the Lean structural persistence core, the epistemic control bridge, the evidence-packet bridge, and implementation candidates while separating formal claims from non-claims.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9f7f1"/>
      <stop offset="52%" stop-color="#eef5f2"/>
      <stop offset="100%" stop-color="#f5f1eb"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 29px Georgia, "Times New Roman", serif; fill: #1e2a24; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #405049; }
      .layerTitle { font: 700 21px Georgia, "Times New Roman", serif; fill: #1e2a24; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #33423b; }
      .tiny { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5d55; }
      .micro { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52625c; }
      .math { font: 700 22px Georgia, "Times New Roman", serif; fill: #24342d; }
      .panel { fill: #fffdf7; stroke-width: 2; rx: 18; filter: url(#shadow3); }
      .core { stroke: #7aa17a; }
      .bridge { stroke: #6f8fb2; }
      .impl { stroke: #c19a5b; }
      .boundary { fill: #fff9f4; stroke: #be7f6d; stroke-width: 2; rx: 18; filter: url(#shadow3); }
      .chip { fill: #f7fbf8; stroke: #9bb89c; stroke-width: 1.5; rx: 13; }
      .chipBlue { fill: #f4f8fc; stroke: #8aa3c0; stroke-width: 1.5; rx: 13; }
      .chipGold { fill: #fff8ea; stroke: #c7a46b; stroke-width: 1.5; rx: 13; }
      .arrow { stroke: #56675e; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead3); }
      .dash { stroke: #8a9791; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrowhead3); }
    </style>
    <marker id="arrowhead3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#56675e"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="url(#bg3)"/>

  <text x="550" y="48" text-anchor="middle" class="title">Structural Persistence to LLM Epistemic Control</text>
  <text x="550" y="76" text-anchor="middle" class="subtitle">A formal core, checked bridges, and bounded implementation candidates.</text>

  <rect x="62" y="108" width="685" height="118" class="panel core"/>
  <text x="92" y="144" class="layerTitle">1. Lean core: structural persistence accounting</text>
  <text x="92" y="176" class="small">Finite feasible regions, fixed mass readout, log-ratio depletion, contraction and repair.</text>
  <text x="92" y="204" class="math">S_n = M_n exp(-B_n)</text>
  <text x="375" y="204" class="tiny">where B_n = sum(d_t - r_t)</text>
  <rect x="535" y="142" width="174" height="54" class="chip"/>
  <text x="622" y="165" text-anchor="middle" class="tiny">existing theorem</text>
  <text x="622" y="186" text-anchor="middle" class="micro">net-action kernel</text>

  <path d="M404 227 C404 238 404 244 404 252" class="arrow"/>

  <rect x="62" y="254" width="685" height="150" class="panel bridge"/>
  <text x="92" y="290" class="layerTitle">2. Epistemic control bridge: abstract LLM-side interface</text>
  <text x="92" y="320" class="small">Represent a control layer as coherent regions plus operators satisfying explicit laws.</text>

  <rect x="96" y="342" width="171" height="44" class="chipBlue"/>
  <text x="181" y="361" text-anchor="middle" class="tiny">contradictionUpdate</text>
  <text x="181" y="380" text-anchor="middle" class="micro">contraction</text>

  <rect x="281" y="342" width="140" height="44" class="chipBlue"/>
  <text x="351" y="361" text-anchor="middle" class="tiny">repairUpdate</text>
  <text x="351" y="380" text-anchor="middle" class="micro">expansion</text>

  <rect x="435" y="342" width="121" height="44" class="chipBlue"/>
  <text x="496" y="361" text-anchor="middle" class="tiny">memory filter</text>
  <text x="496" y="380" text-anchor="middle" class="micro">soundness guard</text>

  <rect x="570" y="342" width="139" height="44" class="chipBlue"/>
  <text x="640" y="361" text-anchor="middle" class="tiny">dependency rewrite</text>
  <text x="640" y="380" text-anchor="middle" class="micro">closure guard</text>

  <text x="92" y="394" class="tiny">Lean wrapper: EpistemicControlSpec -&gt; GeneralStateDynamics.ProblemSpec</text>

  <path d="M404 405 C404 416 404 422 404 430" class="arrow"/>

  <rect x="62" y="432" width="685" height="100" class="panel bridge"/>
  <text x="92" y="464" class="layerTitle">3. Evidence-packet bridge: implementation boundary schema</text>
  <text x="92" y="492" class="small">Artifacts expose provenance, eligibility, witness, dependency, and repair guardrails.</text>
  <rect x="96" y="506" width="116" height="20" class="chipBlue"/>
  <text x="154" y="521" text-anchor="middle" class="micro">provenance</text>
  <rect x="225" y="506" width="110" height="20" class="chipBlue"/>
  <text x="280" y="521" text-anchor="middle" class="micro">eligibility</text>
  <rect x="348" y="506" width="104" height="20" class="chipBlue"/>
  <text x="400" y="521" text-anchor="middle" class="micro">witness</text>
  <rect x="465" y="506" width="115" height="20" class="chipBlue"/>
  <text x="522" y="521" text-anchor="middle" class="micro">closure</text>
  <rect x="593" y="506" width="116" height="20" class="chipBlue"/>
  <text x="651" y="521" text-anchor="middle" class="micro">repair cover</text>

  <path d="M404 533 C404 542 404 548 404 556" class="arrow"/>

  <rect x="62" y="558" width="685" height="70" class="panel impl"/>
  <text x="92" y="588" class="layerTitle">4. Implementations and bounded evidence candidates</text>
  <rect x="96" y="603" width="128" height="20" class="chipGold"/>
  <text x="160" y="618" text-anchor="middle" class="micro">reasoning</text>
  <rect x="239" y="603" width="142" height="20" class="chipGold"/>
  <text x="310" y="618" text-anchor="middle" class="micro">continual update</text>
  <rect x="396" y="603" width="119" height="20" class="chipGold"/>
  <text x="456" y="618" text-anchor="middle" class="micro">memory</text>
  <rect x="530" y="603" width="179" height="20" class="chipGold"/>
  <text x="620" y="618" text-anchor="middle" class="micro">contract diagnostics</text>

  <rect x="786" y="108" width="252" height="520" class="boundary"/>
  <text x="912" y="144" text-anchor="middle" class="layerTitle">Claim Boundary</text>

  <text x="812" y="186" class="small">Formal claim</text>
  <text x="812" y="214" class="tiny">If the bridge interface holds,</text>
  <text x="812" y="236" class="tiny">the control layer inherits the</text>
  <text x="812" y="258" class="tiny">finite net-action kernel.</text>

  <path d="M812 286 L1012 286" stroke="#d6b7a9" stroke-width="1.4"/>

  <text x="812" y="324" class="small">Not claimed</text>
  <text x="812" y="352" class="tiny">No proof of LLM semantics.</text>
  <text x="812" y="374" class="tiny">No proof of model performance.</text>
  <text x="812" y="396" class="tiny">No unconditional memory safety.</text>
  <text x="812" y="418" class="tiny">No automatic support transfer.</text>
  <text x="812" y="440" class="tiny">No proof of detector correctness.</text>

  <path d="M812 468 L1012 468" stroke="#d6b7a9" stroke-width="1.4"/>

  <text x="812" y="506" class="small">Evidence status</text>
  <text x="812" y="534" class="tiny">Implementation results are</text>
  <text x="812" y="556" class="tiny">candidate instantiations and</text>
  <text x="812" y="578" class="tiny">must be evaluated by their own</text>
  <text x="812" y="600" class="tiny">frozen baselines and metrics.</text>

  <path d="M748 376 C764 376 770 376 784 376" class="dash"/>
  <text x="550" y="674" text-anchor="middle" class="subtitle">The bridge narrows prose mapping into checked interface conditions; it does not turn engineering demonstrations into formal semantic proofs.</text>
</svg>
