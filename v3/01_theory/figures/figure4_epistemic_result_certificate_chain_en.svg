<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Epistemic-Control Result Certificate Chain</title>
  <desc id="desc">A diagram showing how an external runner emits a result certificate that corresponds to a Lean benchmark result certificate, induces a valid benchmark protocol, invokes the evaluation metric contract, and reaches a coherent-mass comparison theorem under explicit witnesses.</desc>
  <defs>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17202a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowhead4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4f5f66"/>
    </marker>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font: 700 30px Georgia, "Times New Roman", serif; fill: #17201c; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #46545a; }
      .boxTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #162320; }
      .boxText { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #354348; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #536166; }
      .math { font: 700 18px Georgia, "Times New Roman", serif; fill: #17201c; }
      .external { fill: #f5f8fb; stroke: #7595b5; stroke-width: 2; rx: 12; filter: url(#shadow4); }
      .lean { fill: #f7fbf7; stroke: #78a179; stroke-width: 2; rx: 12; filter: url(#shadow4); }
      .claim { fill: #fff7ed; stroke: #b88b54; stroke-width: 2; rx: 12; filter: url(#shadow4); }
      .boundary { fill: #fff8f5; stroke: #bf7c6a; stroke-width: 2; rx: 12; filter: url(#shadow4); }
      .arrow { stroke: #4f5f66; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead4); }
      .dash { stroke: #8a9791; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrowhead4); }
      .section { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b4b3c; }
    </style>
  </defs>

  <rect width="1120" height="760" class="bg"/>

  <text x="560" y="44" text-anchor="middle" class="title">Epistemic-Control Result Certificate Chain</text>
  <text x="560" y="72" text-anchor="middle" class="subtitle">A finite assumption-to-guarantee path from runner artifacts to the checked coherent-mass comparison.</text>

  <text x="82" y="116" class="section">External artifact layer</text>

  <rect x="70" y="134" width="330" height="86" class="external"/>
  <text x="92" y="164" class="boxTitle">Raw experiment / runner</text>
  <text x="92" y="190" class="boxText">Frozen tasks, fixed readout fields,</text>
  <text x="92" y="211" class="boxText">deterministic aggregation.</text>

  <path d="M235 222 C235 238 235 246 235 258" class="arrow"/>

  <rect x="70" y="260" width="330" height="94" class="external"/>
  <text x="92" y="290" class="boxTitle">Result certificate JSON</text>
  <text x="92" y="316" class="boxText">Protocol id, runner id, digests,</text>
  <text x="92" y="337" class="boxText">metric-dominance summary.</text>

  <path d="M235 356 C235 372 235 380 235 392" class="dash"/>

  <text x="490" y="116" class="section">Lean theorem-side layer</text>

  <rect x="430" y="134" width="360" height="86" class="lean"/>
  <text x="452" y="164" class="boxTitle">BenchmarkResultCertificate</text>
  <text x="452" y="190" class="boxText">Lean does not interpret JSON or digests.</text>
  <text x="452" y="211" class="boxText">It records the certificate shape.</text>

  <path d="M610 222 C610 238 610 246 610 258" class="arrow"/>

  <rect x="430" y="260" width="360" height="94" class="lean"/>
  <text x="452" y="290" class="boxTitle">ValidBenchmarkResultCertificate</text>
  <text x="452" y="316" class="boxText">Frozen surface/readout, same horizon,</text>
  <text x="452" y="337" class="boxText">positivity, metric/readout witnesses.</text>

  <path d="M610 356 C610 372 610 380 610 392" class="arrow"/>

  <rect x="430" y="394" width="360" height="86" class="lean"/>
  <text x="452" y="424" class="boxTitle">ValidEpistemicBenchmarkProtocol</text>
  <text x="452" y="450" class="boxText">Protocol obligations are assembled</text>
  <text x="452" y="471" class="boxText">as theorem-side witnesses.</text>

  <path d="M610 482 C610 498 610 506 610 518" class="arrow"/>

  <rect x="430" y="520" width="360" height="86" class="lean"/>
  <text x="452" y="550" class="boxTitle">EvaluationMetricContract</text>
  <text x="452" y="576" class="boxText">Per-step dominance plus readout</text>
  <text x="452" y="597" class="boxText">alignment gives NetActionNoWorse.</text>

  <path d="M610 608 C610 624 610 632 610 644" class="arrow"/>

  <rect x="430" y="646" width="360" height="74" class="claim"/>
  <text x="452" y="676" class="boxTitle">Checked comparison theorem</text>
  <text x="452" y="702" class="math">coherentMass baseline n &lt;= coherentMass controlled n</text>

  <rect x="838" y="134" width="226" height="586" class="boundary"/>
  <text x="951" y="166" text-anchor="middle" class="boxTitle">Boundary</text>

  <text x="866" y="206" class="boxText">Lean proves:</text>
  <text x="866" y="230" class="tiny">witnesses imply theorem.</text>
  <text x="866" y="254" class="tiny">certificate induces protocol.</text>
  <text x="866" y="278" class="tiny">metrics invoke comparison.</text>

  <path d="M866 310 L1036 310" stroke="#d9b7ab" stroke-width="1.3"/>

  <text x="866" y="350" class="boxText">Runner checks:</text>
  <text x="866" y="374" class="tiny">JSON shape, task surface,</text>
  <text x="866" y="398" class="tiny">metric aggregation, digests.</text>

  <path d="M866 430 L1036 430" stroke="#d9b7ab" stroke-width="1.3"/>

  <text x="866" y="470" class="boxText">Not proved here:</text>
  <text x="866" y="494" class="tiny">LLM semantics.</text>
  <text x="866" y="518" class="tiny">model performance.</text>
  <text x="866" y="542" class="tiny">dataset validity.</text>
  <text x="866" y="566" class="tiny">workflow correctness.</text>
  <text x="866" y="590" class="tiny">memory safety.</text>

  <path d="M400 307 C414 307 420 307 428 307" class="dash"/>
  <text x="235" y="390" text-anchor="middle" class="tiny">corresponds to, but is not parsed by Lean</text>
</svg>
